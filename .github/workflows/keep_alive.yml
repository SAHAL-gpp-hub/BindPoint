name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (cron runs on UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set. Skipping ping."
            exit 0
          fi
          echo "Pinging ${BACKEND_URL}/health..."
          curl -s -f -m 15 "${BACKEND_URL%/}/health" || echo "Ping attempt finished"
