services:
  - type: web
    name: bindpoint-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///storage/print_station.db
      - key: SYNC_DATABASE_URL
        value: sqlite:///storage/print_station.db
      - key: SECRET_KEY
        generateValue: true
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "240"
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
