services:
  - type: web
    name: bindpoint-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "BindPoint"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPI_ID
        sync: false
      - key: PAYEE_NAME
        value: "BindPoint Print Station"
      - key: COLLECTION_INSTRUCTIONS
        sync: false
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "240"
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
